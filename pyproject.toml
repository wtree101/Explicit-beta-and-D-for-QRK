[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "qrk-analysis"
version = "0.1.0"
description = "Theory and experiments for streaming quantile randomized Kaczmarz"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qrk_analysis*", "experiments*", "heatmap_data_display*"]
